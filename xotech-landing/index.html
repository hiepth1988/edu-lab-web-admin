<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XO</title>
<meta name="description" content="XO — Space to become.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #05050a;
    --fg: #f5f5f7;
    --accent: #7c5cff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: radial-gradient(ellipse at 50% 40%, #14101f 0%, #05050a 70%);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .stage {
    text-align: center;
    padding: 2rem;
  }

  .logo {
    font-size: clamp(6rem, 22vw, 16rem);
    font-weight: 800;
    letter-spacing: 0.02em;
    line-height: 1;
    background: linear-gradient(135deg, #ffffff 0%, #b9a9ff 45%, #7c5cff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 60px rgba(124, 92, 255, 0.35));
    animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .tagline {
    margin-top: 1.25rem;
    font-size: clamp(1rem, 2.6vw, 1.6rem);
    font-weight: 400;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(245, 245, 247, 0.65);
    animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(16px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 480px) {
    .tagline { letter-spacing: 0.18em; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="logo">XO</div>
    <div class="tagline">Space to become</div>
  </div>
</body>
</html>
