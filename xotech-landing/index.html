<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XO</title>
<meta name="description" content="XO — Space to become.">
<meta property="og:title" content="XO">
<meta property="og:description" content="Space to become.">
<meta property="og:image" content="https://xotech.space/og-image.png">
<meta name="theme-color" content="#0B1328">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400&display=swap">
<style>
  :root {
    --bg: #070C1A;
    --fg: #F2F4F8;
    --spark: #F6BC4A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: radial-gradient(ellipse at 50% 40%, #14213D 0%, var(--bg) 70%);
    color: var(--fg);
    font-family: "Lexend", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .stage {
    text-align: center;
    padding: 2rem;
  }

  .logo {
    display: block;
    width: clamp(12rem, 44vw, 30rem);
    height: auto;
    margin: 0 auto;
    overflow: visible;
    filter: drop-shadow(0 0 60px rgba(246, 188, 74, 0.18));
    animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* the spark leaves the open O: the "become" moment */
  .spark {
    animation: escape 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both;
  }

  .tagline {
    margin-top: 2rem;
    font-size: clamp(1rem, 2.6vw, 1.6rem);
    font-weight: 300;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(242, 244, 248, 0.7);
    animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(16px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes escape {
    from {
      opacity: 0;
      transform: translate(-14px, 10px);
    }
    to {
      opacity: 1;
      transform: translate(0, 0);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo, .spark, .tagline { animation: none; }
  }

  @media (max-width: 480px) {
    .tagline { letter-spacing: 0.18em; }
  }
</style>
</head>
<body>
  <div class="stage">
    <h1>
      <svg class="logo" viewBox="6 16 130 68" role="img" aria-label="XO">
        <path d="M14 24 L54 76 M54 24 L14 76" fill="none" stroke="#F2F4F8" stroke-width="12" stroke-linecap="round"/>
        <path d="M115.6 45.8 A24 24 0 1 1 104 29.2" fill="none" stroke="#F2F4F8" stroke-width="11" stroke-linecap="round"/>
        <g class="spark">
          <circle cx="118.6" cy="31.6" r="2.6" fill="#F6BC4A"/>
          <circle cx="127.5" cy="25.2" r="6.5" fill="#F6BC4A"/>
        </g>
      </svg>
    </h1>
    <div class="tagline">Space to become</div>
  </div>
</body>
</html>
